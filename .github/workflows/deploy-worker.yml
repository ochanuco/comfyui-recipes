name: deploy worker

# production だけを契機にする。production は昇格 PR の merge でしか動かないので、
# fork の PR や main の変更が self-hosted runner に乗る道が無い。
on:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: update the GPU box checkout and restart work
    runs-on: [self-hosted, gpu-box]
    timeout-minutes: 15
    steps:
      # The runner's own step script is unsigned, so the box's execution policy
      # rejects `shell: powershell`; cmd hands the script to powershell with
      # the policy bypassed instead.
      - name: Deploy
        shell: cmd
        env:
          WORKER_CHECKOUT: ${{ vars.WORKER_CHECKOUT }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%WORKER_CHECKOUT%\scripts\worker\deploy.ps1" -Checkout "%WORKER_CHECKOUT%" -Ref production
