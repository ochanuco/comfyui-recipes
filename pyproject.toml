[project]
name = "comfyui-recipes"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[project.scripts]
comfy-recipes = "comfyui_recipes.interfaces.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Runtime dependencies are NOT declared here on purpose. scripts/update-comfyui.sh
# installs the pinned upstream ComfyUI checkout's requirements.txt into .venv;
# leaving uv unmanaged stops `uv run` / `uv sync` from treating those packages as
# extraneous and uninstalling them.
#
# The mac stopped running ComfyUI in 2026-08, so .venv currently holds only what
# the client scripts import -- pillow, numpy, opencv-python, scipy. See the
# Python Environment section of README.md.
[tool.uv]
managed = false
